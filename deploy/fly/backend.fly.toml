app = 'narative-api-ipl26'
primary_region = 'sin'

[env]
  UPLOAD_DIR = '/data/uploads'
  DOCUMENT_PARSER = 'auto'
  DEV_UNLOCK_ALL_TIERS = 'false'
  CHARACTER_PARALLEL = '3'
  MAX_UPLOAD_MB = '100'
  OCR_ENABLED = 'true'
  OCR_LANGUAGES = 'ind+eng'
  OCR_DPI = '200'
  ROUTER_BASE_URL = 'http://narative-router-ipl26.internal:20128/v1'
  CORS_ORIGINS = 'https://narativedef.netlify.app'
  FRONTEND_URL = 'https://narativedef.netlify.app'

[[mounts]]
  source = 'narative_data'
  destination = '/data'
  initial_size = '5gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '2m'
    interval = '30s'
    timeout = '10s'
    method = 'GET'
    path = '/docs'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
